# Replaces CodeQL default setup, which has to stay off: GitHub rejects results
# from both. Default setup cannot build the Android code without Flutter.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 4 * * 1'

env:
  FLUTTER_VERSION: '3.44.4'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v7

      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - if: matrix.build-mode == 'manual'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - if: matrix.build-mode == 'manual'
        run: |
          flutter pub get
          flutter build apk --debug --config-only

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL sees only Kotlin compiled in a process it traces, not in the Gradle or Kotlin daemon
      - if: matrix.build-mode == 'manual'
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon -Pkotlin.compiler.execution.strategy=in-process

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
