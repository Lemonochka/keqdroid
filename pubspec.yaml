name: keqdroid
description: "KEQDIS proxy/VPN client for Android and Windows."
publish_to: 'none'

version: 0.13.0+40

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  dio: ^5.9.0
  crypto: ^3.0.6
  shared_preferences: ^2.5.5
  uuid: ^4.5.1
  file_picker: ^12.0.0-beta.5
  path_provider: ^2.1.5
  path: ^1.9.1
  share_plus: ^13.1.0
  qr_flutter: ^4.1.0
  workmanager: ^0.10.7
  flutter_local_notifications: ^22.0.0
  dynamic_color: ^1.8.1
  # Тональные палитры M3. Приходит транзитивно с dynamic_color, но мы считаем
  # ими сами (см. utils/system_accent.dart) — значит зависимость наша, прямая.
  material_color_utilities: ^0.13.0
  country_flags: ^4.1.2
  # Рисуем флаги из ассетов country_flags сами: его виджет не умеет часть
  # положенных в пакет картинок (🇪🇺, 🇺🇳, флаги субъектов). См. FlagArt.
  jovial_svg: ^1.1.30
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.2.3
  intl: ^0.20.2
  open_filex: ^4.5.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.1.0
  flutter_markdown_plus: ^1.0.7
  window_manager: ^0.5.1
  tray_manager: ^0.5.3
  mobile_scanner: ^7.2.0
  androidx_graphics_shapes: ^1.6.1
  # Подписки для clash-клиентов приходят в YAML. Приходит транзитивно с
  # тулингом, но разбираем его мы сами (см. utils/custom_clash_config.dart) —
  # значит зависимость наша, прямая.
  yaml: ^3.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  mocktail: ^1.0.4
  image: ^4.8.0

# After `flutter pub get`, run `powershell -File tool/sync_windows_plugins.ps1`
# before Windows builds — Firebase is Android-only and must be stripped from
# the generated Windows plugin list.

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffb2bd"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon_foreground.png"
  windows:
    generate: true
    image_path: "assets/icon_windows_launcher.png"
    icon_size: 256

flutter_native_splash:
  color: "#FFF5F7"
  color_dark: "#1A1014"
  image: assets/icon.png
  image_dark: assets/icon.png
  android_12:
    color: "#FFF5F7"
    color_dark: "#1A1014"
    image: assets/icon.png
    image_dark: assets/icon.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icon_foreground.png
    - assets/icon_windows_launcher.png
    # OFL-лицензии шрифтов обязаны ехать вместе со шрифтами в дистрибутиве.
    - assets/fonts/Comfortaa-OFL.txt
    - assets/fonts/Montserrat-OFL.txt
    - assets/fonts/Rubik-OFL.txt
    # GeoIP/Geosite DBs for xray routing (geoip:/geosite: rules on Android).
    - assets/bin/windows/geoip.dat
    - assets/bin/windows/geosite.dat
  # NOTE: core binaries (assets/bin/windows, assets/bin/linux) are deliberately
  # NOT Flutter assets. Flutter bundles assets into every platform, which dragged
  # the Windows .exe + Linux ELF + geo data into the Android APK (~150 MB of dead
  # weight; Android uses jniLibs instead). They're now installed next to the
  # executable per-platform by windows/ and linux/ CMakeLists.txt, so each
  # desktop build ships only its own and the APK ships none.

  fonts:
    # Comfortaa (variable, OFL, с кириллицей) — шрифт kawaii-пресета темы.
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa-Variable.ttf
    # Montserrat (variable, OFL, с кириллицей) — опция выбора шрифта в Appearance.
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
    # Rubik (variable, OFL, с кириллицей) — опция выбора шрифта в Appearance.
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Variable.ttf
