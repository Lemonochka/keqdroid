org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin (AGP 9) держит нас в режиме совместимости из-за dynamic_color:
# он объявляет свой buildscript-classpath (AGP 8.13.1 + KGP), и с флагом `true`
# сборка падает на применении com.android.library в его build.gradle.kts.
# Остальные плагины уже готовы: mobile_scanner и workmanager_android применяют
# KGP условно, file_picker тоже. Как только dynamic_color починят — флаг снять.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
